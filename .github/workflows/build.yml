name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          mkdir -p $ANDROID_HOME/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fb\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb139a648b0" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Verify Firebase configuration
        run: |
          test -s app/google-services.json
          echo "Firebase google-services.json is present."

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify generated Firebase Android resources
        run: |
          ./gradlew --no-daemon processDebugGoogleServices
          FILE="app/build/generated/res/google-services/debug/values/values.xml"
          test -s "$FILE"
          python3 - "$FILE" <<'PY'
          import hashlib, json, re, sys
          path=sys.argv[1]
          source=json.load(open("app/google-services.json"))
          key=source["client"][0]["api_key"][0]["current_key"]
          xml=open(path, encoding="utf-8").read()
          def get(name):
              m=re.search(r'<string\s+name="' + re.escape(name) + r'"[^>]*>(.*?)</string>', xml, re.S)
              if not m:
                  raise SystemExit("Missing generated resource: " + name)
              return m.group(1)
          app_id=get("google_app_id")
          project_id=get("project_id")
          generated_key=get("google_api_key")
          if app_id != "1:905902052873:android:1bf6d3ea58532b9ab04ad8":
              raise SystemExit("Generated google_app_id does not match Firebase Android app.")
          if project_id != "get-taxi-meter-productio-b0cea":
              raise SystemExit("Generated project_id does not match Firebase project.")
          if generated_key != key:
              raise SystemExit("Generated google_api_key does not match google-services.json.")
          print("Firebase generated resources match google-services.json.")
          print("google_api_key SHA256:", hashlib.sha256(generated_key.encode()).hexdigest())

      - name: Validate Firebase Authentication API key
        run: |
          KEY=$(python3 -c 'import json; print(json.load(open("app/google-services.json"))["client"][0]["api_key"][0]["current_key"])')
          RESPONSE=$(curl -sS -X POST             -H "Content-Type: application/json"             -d '{"email":"firebase-key-diagnostic-noreal@example.invalid","password":"NotARealPassword123!","returnSecureToken":true}'             "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$KEY")
          echo "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); msg=d.get("error",{}).get("message",""); print("Firebase Auth diagnostic response:", msg); sys.exit(1 if msg in ("API_KEY_INVALID","INVALID_API_KEY") else 0)'

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetTaxiMeter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
