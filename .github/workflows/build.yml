name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Firebase configuration
        run: |
          test -s app/google-services.json
          echo "google-services.json: PRESENT"
          echo "Firebase project: $(jq -r '.project_info.project_id' app/google-services.json)"
          echo "Firebase Android app ID: $(jq -r '.client[0].client_info.mobilesdk_app_id' app/google-services.json)"
          echo "Firebase package: $(jq -r '.client[0].client_info.android_client_info.package_name' app/google-services.json)"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate Firebase resources
        run: ./gradlew --no-daemon processDebugGoogleServices

      - name: Check generated Firebase resources
        run: |
          FILE="app/build/generated/res/google-services/debug/values/values.xml"
          test -s "$FILE"
          grep -q 'name="google_app_id"' "$FILE"
          grep -q 'name="google_api_key"' "$FILE"
          grep -q 'name="project_id"' "$FILE"
          echo "Generated Firebase resources: PASS"

      - name: Test Firebase Authentication API key
        shell: bash
        run: |
          set -e
          KEY=$(jq -r '.client[0].api_key[0].current_key' app/google-services.json)
          RESPONSE_FILE=/tmp/firebase-auth-response.json
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}"             -X POST             -H "Content-Type: application/json"             -d '{"email":"firebase-key-diagnostic@example.invalid","password":"NotARealPassword123!","returnSecureToken":true}'             "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$KEY")
          MESSAGE=$(jq -r '.error.message // "NO_ERROR"' "$RESPONSE_FILE")
          echo "Firebase Auth HTTP status: $HTTP_CODE"
          echo "Firebase Auth diagnostic: $MESSAGE"
          if [ "$MESSAGE" = "API_KEY_INVALID" ] || [ "$MESSAGE" = "INVALID_API_KEY" ]; then
            echo "RESULT: FIREBASE API KEY IS REJECTED BY IDENTITY TOOLKIT"
            exit 1
          fi
          echo "RESULT: API KEY WAS ACCEPTED BY IDENTITY TOOLKIT"

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetTaxiMeter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
