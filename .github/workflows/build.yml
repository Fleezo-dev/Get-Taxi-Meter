name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Inject Firebase configuration from repository secret
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/google-services.json
          echo "google-services.json: INJECTED FROM GOOGLE_SERVICES_JSON SECRET"

      - name: Verify Firebase configuration
        run: |
          test -s app/google-services.json
          echo "google-services.json: PRESENT"
          echo "Firebase project: $(jq -r '.project_info.project_id' app/google-services.json)"
          echo "Firebase Android app ID: $(jq -r '.client[0].client_info.mobilesdk_app_id' app/google-services.json)"
          echo "Firebase package: $(jq -r '.client[0].client_info.android_client_info.package_name' app/google-services.json)"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate Firebase resources
        run: ./gradlew --no-daemon :app:processDebugGoogleServices --rerun-tasks

      - name: Check generated Firebase resources
        shell: bash
        run: |
          set -e
          echo "Generated Firebase resource files:"
          find app/build/generated -type f -print | sort || true
          FILE=$(find app/build/generated -type f -name 'values.xml' -path '*/processDebugGoogleServices/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: Firebase google-services values.xml was not generated"
            echo "Generated directory tree:"
            find app/build/generated/res -maxdepth 6 -type f -print || true
            exit 1
          fi
          echo "Using generated file: $FILE"
          grep -q 'name="google_app_id"' "$FILE"
          grep -q 'name="google_api_key"' "$FILE"
          grep -q 'name="project_id"' "$FILE"
          echo "Generated Firebase resources: PASS"

      - name: Test Firebase Authentication API key
        shell: bash
        run: |
          set -e
          KEY=$(jq -r '.client[0].api_key[0].current_key' app/google-services.json)
          RESPONSE_FILE=/tmp/firebase-auth-response.json
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}"             -X POST             -H "Content-Type: application/json"             -d '{"email":"firebase-key-diagnostic@example.invalid","password":"NotARealPassword123!","returnSecureToken":true}'             "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$KEY")
          MESSAGE=$(jq -r '.error.message // "NO_ERROR"' "$RESPONSE_FILE")
          STATUS=$(jq -r '.error.status // "NO_STATUS"' "$RESPONSE_FILE")
          echo "Firebase Auth HTTP status: $HTTP_CODE"
          echo "Firebase Auth error status: $STATUS"
          echo "Firebase Auth diagnostic: $MESSAGE"
          if [ "$HTTP_CODE" -ge 400 ] &&              { [[ "$MESSAGE" == *"API key not valid"* ]] ||                [ "$MESSAGE" = "API_KEY_INVALID" ] ||                [ "$MESSAGE" = "INVALID_API_KEY" ]; }; then
            echo "RESULT: FIREBASE API KEY IS REJECTED BY IDENTITY TOOLKIT"
            exit 1
          fi
          if [ "$HTTP_CODE" -ge 400 ] && [ "$STATUS" = "INVALID_ARGUMENT" ]; then
            echo "RESULT: FIREBASE AUTH REJECTED THE REQUEST"
            exit 1
          fi
          echo "RESULT: FIREBASE API KEY WAS NOT REJECTED"

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e
          test -n "$GOOGLE_MAPS_API_KEY"
          echo "Google Maps API key secret: PRESENT"
          ./gradlew --no-daemon assembleDebug

      - name: Print debug signing SHA-1
        run: ./gradlew --no-daemon :app:signingReport

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetTaxiMeter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
