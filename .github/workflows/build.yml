name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          mkdir -p $ANDROID_HOME/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fb\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb139a648b0" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Verify Firebase configuration
        run: |
          test -s app/google-services.json
          echo "Firebase google-services.json is present."

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify generated Firebase Android resources
        run: |
          ./gradlew processDebugGoogleServices
          test -s app/build/generated/res/google-services/debug/values/values.xml
          grep -q 'name="google_app_id"[^>]*>1:905902052873:android:1bf6d3ea58532b9ab04ad8<' app/build/generated/res/google-services/debug/values/values.xml
          grep -q 'name="project_id"[^>]*>get-taxi-meter-productio-b0cea<' app/build/generated/res/google-services/debug/values/values.xml
          KEY_SHA256=$(python3 -c "import hashlib,re; s=open('app/build/generated/res/google-services/debug/values/values.xml').read(); k=re.search(r'name=\"google_api_key\"[^>]*>([^<]+)<',s).group(1); print(hashlib.sha256(k.encode()).hexdigest())")
          echo "Firebase generated resources are using the expected project/app."
          echo "google_api_key SHA256: $KEY_SHA256"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetTaxiMeter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
